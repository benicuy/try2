name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip
        run: unzip -qo "$(find . -name 'BranaBrowser-Android.zip' | head -1)" -d src_out
      - name: Build
        run: |
          DIR=$(dirname "$(find src_out -name settings.gradle | head -1)")
          cd "$DIR" && gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BranaBrowser-APK
          path: "**/app-debug.apk"
